<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071d33">
<title>elegance · escenario 3D integrado</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071728}
body{--ice:#142e49;--halo:#397baa;background:radial-gradient(ellipse at 50% 25%,var(--halo) 0%,var(--ice) 47%,#04101e 100%)}
body.night{--ice:#071427;--halo:#174467}body.sunset{--ice:#3a2942;--halo:#86667f}body.pearl{--ice:#38536a;--halo:#83b5ca}
#panther{position:absolute;inset:0;width:100%;height:100%;background:transparent;--poster-color:transparent;outline:none;touch-action:none}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#e4faff;font:600 12px/1.6 system-ui,sans-serif;text-align:center;max-width:80%;padding:12px 17px;background:#051a2edc;border:1px solid #82d1ff80;border-radius:13px;pointer-events:none;box-shadow:0 8px 30px #0008}
#credit{position:absolute;right:9px;bottom:8px;color:#b7d8ed;font:9px/1.4 system-ui,sans-serif;padding:3px 7px;border-radius:8px;background:#061525a8;pointer-events:none}
</style>
</head>
<body>
<model-viewer id="panther" src="./assets/panther/elegance-panther-ice-gallery-v8.glb"
 alt="Pantera negra tridimensional con 47 huesos y arquitectura de showroom azul hielo. Puedes mover la cámara."
 camera-controls disable-pan loading="eager" reveal="auto" autoplay interaction-prompt="none"
 shadow-intensity="0.9" shadow-softness="0.8" exposure="1.25" environment-image="neutral"
 camera-orbit="40deg 71deg 2.5m" camera-target="0m .45m .20m"
 min-camera-orbit="auto 40deg auto" max-camera-orbit="auto 100deg auto"
 animation-name="idle_breathe"></model-viewer>
<div id="loading" role="status">Preparando pantera y escenario 3D real…</div>
<div id="credit">Modelo base: kenchoo · CC BY 4.0</div>
<script>
(()=>{
'use strict';
const el=document.querySelector('#panther'),loading=document.querySelector('#loading');
const allowed=['idle_breathe','roar_short','look_left','look_right','stance_shift','walk_original'];
const origin=location.origin;
const camera={hero:'40deg 71deg 2.5m',front:'90deg 75deg 2.6m',side:'5deg 76deg 2.65m',top:'35deg 44deg 2.9m'};
let ready=false,shouldPlay=!matchMedia('(prefers-reduced-motion: reduce)').matches,active='idle_breathe',preset='ice';
function reply(event,data={}){if(window.parent!==window)window.parent.postMessage({type:'ELEGANCE_3D',event,...data},origin)}
function play(name){
 if(!allowed.includes(name))return;
 active=name;
 if(!ready)return;
 if(!el.availableAnimations.includes(name)){reply('clip-missing',{name});return}
 el.animationName=name;el.currentTime=0;
 try{el.play({repetitions:['roar_short','look_left','look_right'].includes(name)?1:Infinity});shouldPlay=true}
 catch(e){reply('error',{message:'No fue posible reproducir el clip'})}
 reply('clip',{name});
}
function setCamera(view){
 const a=view==='left'?'side':view==='high'?'top':view==='reset'?'hero':view;
 if(!camera[a])return;
 el.cameraOrbit=camera[a];el.jumpCameraToGoal();
 reply('camera',{view:a});
}
function apply(msg){
 const cmd=msg.command;
 if(cmd==='camera')setCamera(msg.view);
 if(cmd==='play')play(msg.clip);
 if(cmd==='pause'){shouldPlay=false;if(ready)el.pause();reply('pause')}
 if(cmd==='resume'){shouldPlay=true;if(ready)el.play();reply('resume')}
 if(cmd==='exposure'){let v=Number(msg.value);if(Number.isFinite(v))el.exposure=Math.max(.5,Math.min(2.1,v))}
 if(cmd==='glow'){let v=Number(msg.value);if(Number.isFinite(v))el.shadowIntensity=Math.max(.15,Math.min(1.3,v))}
 if(cmd==='preset'){preset=['ice','night','sunset','pearl'].includes(msg.value)?msg.value:'ice';document.body.className=preset}
 if(cmd==='float'){if(msg.value)el.setAttribute('auto-rotate','');else el.removeAttribute('auto-rotate')}
 if(cmd==='reset'){document.body.className='';preset='ice';el.exposure=1.25;el.shadowIntensity=.9;el.removeAttribute('auto-rotate');setCamera('hero');play('idle_breathe')}
 if(cmd==='identify')reply('ready',{ready,clips:[...el.availableAnimations||[]]})
}
window.addEventListener('message',e=>{if(e.origin!==origin||e.source!==window.parent||e.data?.type!=='ELEGANCE_3D_COMMAND')return;apply(e.data)});
el.addEventListener('load',()=>{ready=true;loading.hidden=true;const clips=[...el.availableAnimations];if(!clips.includes('idle_breathe')){reply('error',{message:'GLB sin animación de respiración'});return}reply('ready',{ready,clips});const startPlaying=shouldPlay;play(active);shouldPlay=startPlaying;if(!shouldPlay)el.pause()});
el.addEventListener('error',()=>{ready=false;loading.textContent='No fue posible cargar el GLB; vuelve a la vista fotográfica';loading.hidden=false;reply('error',{message:'Error al cargar el GLB'})});
document.addEventListener('visibilitychange',()=>{if(document.hidden)el.pause();else if(shouldPlay&&ready)el.play()});
window.addEventListener('pagehide',()=>{if(ready)el.pause()});
reply('iframe-ready');
})();
</script>
</body></html>
