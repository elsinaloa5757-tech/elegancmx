name: Elegance MX Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run check
      - run: node --check catalog-recovery.js
      - run: node --check panel.js
      - run: node scripts/build-public.mjs
      - run: node --test tests/ai-utils.test.mjs tests/category-router.test.mjs
      - run: node scripts/build-auto-categories.mjs
      - run: python3 -m json.tool data/ai-classifications.json > /dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm test
