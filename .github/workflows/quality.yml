name: Elegance MX Quality
on:
  push:
    branches: [main, 'feature/pantera-panel-ready-v10-20261026']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run check
      - run: node --check catalog-recovery.js
      - run: node --check panel.js
      - run: node --check admin.js
      - run: node --check studio.js
      - run: node --test tests/curation.test.mjs
      - run: node --check social-clover.js
      - run: node --test tests/identification-audit.test.mjs
      - run: node scripts/fetch-owner-feedback.mjs
      - run: python3 -m unittest discover -s tests -p 'test_ocr_hints.py' -v
      - run: node --test tests/name-draft-utils.test.mjs
      - run: node --test tests/web-reference-utils.test.mjs
      - run: node scripts/build-identification-audit.mjs
      - run: node --test tests/dynamic-sections.test.mjs
      - run: node scripts/build-dynamic-sections.mjs
      - run: node scripts/build-public.mjs
      - run: node --test tests/ai-utils.test.mjs tests/category-router.test.mjs tests/visual-relations.test.mjs tests/low-confidence-utils.test.mjs
      - run: node scripts/build-auto-categories.mjs
      - run: node scripts/build-visual-relations.mjs
      - run: python3 -m json.tool data/ai-classifications.json > /dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Save verified mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elegance-mobile-visual-audit
          path: |
            test-results/elegance-mobile-reference.png
            test-results/v10-*.png
            dist/assets/panther/elegance-panther-ice-gallery-v8.glb
            dist/assets/panther/elegance-panther-obsidian-v8.glb
          if-no-files-found: ignore
          retention-days: 7
