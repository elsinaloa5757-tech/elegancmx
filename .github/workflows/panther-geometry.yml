name: Panther GLB geometry audit
on:
  push:
    branches: ['feature/pantera-panel-ready-v10-20261026']
    paths:
      - '.github/workflows/panther-geometry.yml'
      - 'scripts/decode_panther_v8.py'
      - 'assets/panther/v8-parts/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile verified Panther V8 model
        run: python3 scripts/decode_panther_v8.py
      - name: Package actual GLB models for anatomical audit
        uses: actions/upload-artifact@v4
        with:
          name: elegance-panther-v10-geometry
          path: dist/assets/panther/*.glb
          if-no-files-found: error
          retention-days: 7
