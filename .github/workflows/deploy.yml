name: Deploy Elegance MX to Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'panel.js'
      - 'admin.js'
      - 'admin.css'
      - 'studio.html'
      - 'studio.js'
      - 'studio.css'
      - 'data/catalog-curation.json'
      - 'panel.css'
      - 'social-clover.js'
      - 'social-clover.css'
      - 'assets/elegance-social-clover.webp'
      - 'data/social-links.json'
      - 'archivo.html'
      - 'styles.css'
      - 'app.js'
      - 'catalog-recovery.js'
      - 'scripts/build-public.mjs'
      - 'tests/**'
      - 'data/imagekit-media.json'
      - 'data/auto-categories.json'
      - 'data/auto-categories-summary.json'
      - 'data/ai-classifications.json'
      - 'data/vision-drafts.json'
      - 'data/visual-relations.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elegance-cloudflare-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'elsinaloa5757-tech/elegancmx'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKENS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install testing tools
        run: npm install --no-package-lock
      - name: Verify public storefront and archive
        run: |
          npm run check
          node --check catalog-recovery.js
          node --check panel.js
          node --check admin.js
          node --check studio.js
          node --test tests/curation.test.mjs
          node --check social-clover.js
          node --test tests/visual-relations.test.mjs
          node scripts/build-visual-relations.mjs
          node scripts/build-public.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test storefront desktop and mobile
        run: npm test
      - name: Preserve ready-to-publish Cloudflare static package
        uses: actions/upload-artifact@v4
        with:
          name: elegance-mx-cloudflare-dist
          path: dist/
          retention-days: 30
      - name: Confirm Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing Cloudflare API token: configure CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_TOKENS in GitHub Actions secrets."
            exit 1
          fi
      - name: Publish validated static catalogue
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKENS }}
          accountId: bbf56b8cf631cef5812f60d36336b8ac
          command: pages deploy dist --project-name=elegancemx --branch=main
