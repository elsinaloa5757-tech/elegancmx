name: Elegance MX — Verificar subida privada a ImageKit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-imagekit-upload.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke_test:
    if: github.repository == 'elsinaloa5757-tech/elegancmx'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Test signed upload directly from the encrypted Supabase Vault
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,sys,urllib.request,urllib.parse,urllib.error
          endpoint=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          glue='&' if '?' in endpoint else '?'
          query=endpoint+glue+'audience='+urllib.parse.quote('elegance-imagekit-upload-test')
          req=urllib.request.Request(query,headers={
           'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as response:
              token=json.load(response)['value']
          req=urllib.request.Request(
            'https://czekazhacqaamwecjthp.supabase.co/functions/v1/elegance-admin',
            data=json.dumps({'action':'github-upload-test'}).encode(),
            headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},
            method='POST')
          try:
              with urllib.request.urlopen(req,timeout=60) as response:
                  result=json.load(response)
          except urllib.error.HTTPError as error:
              details=json.load(error)
              message=str(details.get('error','unknown'))[:300]
              print('::error::ImageKit upload verification:',message)
              sys.exit(1)
          if result.get('uploaded') is not True or result.get('deleted') is not True:
              print('::error::ImageKit test not confirmed')
              sys.exit(1)
          print('ImageKit verified: signed upload accepted with original credentials; test asset deleted.')
          PY
