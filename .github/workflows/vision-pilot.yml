name: Elegance MX — Piloto visión gratuita sin créditos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vision-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vision-pilot:
    if: github.repository == 'elsinaloa5757-tech/elegancmx'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only open vision inference (no paid AI API)
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --quiet transformers==4.55.2 pillow requests
      - name: Test image understanding on two recently uploaded photos
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/vision-pilot.py
      - name: Preserve visual descriptions as drafts for quality review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elegance-open-vision-2-photo-pilot
          path: exports/vision-pilot.json
          retention-days: 7
          if-no-files-found: ignore
